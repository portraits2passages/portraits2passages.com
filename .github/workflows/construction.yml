# Construit le site sur chaque proposition de modification (dont celles de Renovate) :
# une mise à jour qui casse la construction n'est jamais fusionnée automatiquement.
# La branche main est construite et publiée par deploiement.yml.
name: Construction du site

on:
  pull_request:

permissions:
  contents: read

jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
