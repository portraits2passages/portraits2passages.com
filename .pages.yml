# Back-office Pages CMS (https://pagescms.org) : se connecter avec GitHub, choisir ce dépôt.
media:
  input: public/images
  output: /images
content:
  - name: editions
    label: Éditions
    type: collection
    path: src/content/editions
    filename: "{fields.titre}.md"
    view:
      fields: [titre, date]
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: titre, label: Titre, type: string, required: true }
      - { name: date, label: Date de publication, type: date, required: true }
      - { name: description, label: Résumé (cartes + moteurs de recherche), type: text, required: true }
      - { name: chapo, label: Chapô, type: text, required: true }
      - { name: couverture, label: Image de couverture, type: image, required: true }
      - { name: youtube, label: "Identifiant de la vidéo YouTube (ex. Q1Y7ekxagGA)", type: string, required: true }
      - { name: carte, label: Lien de la carte uMap, type: string, required: true }
      - { name: carteTexte, label: Texte d'introduction de la carte, type: text }
      - name: defis
        label: Défis
        type: object
        list: true
        fields:
          - { name: nom, label: Nom du défi, type: string }
          - { name: question, label: Énigme, type: text }
          - { name: reponse, label: Réponse, type: text }
          - { name: image, label: Image (facultative, ex. un blason), type: image }
          - { name: imageAlt, label: Description de l'image (accessibilité), type: string }
      - { name: body, label: Récit, type: rich-text }
  - name: editions-en
    label: Éditions (anglais)
    type: collection
    path: src/content/editions-en
    filename: "{fields.titre}.md"  # à renommer comme le fichier français correspondant
    view:
      fields: [titre, date]
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: titre, label: Titre, type: string, required: true }
      - { name: date, label: Date de publication, type: date, required: true }
      - { name: description, label: Résumé (cartes + moteurs de recherche), type: text, required: true }
      - { name: chapo, label: Chapô, type: text, required: true }
      - { name: couverture, label: Image de couverture, type: image, required: true }
      - { name: youtube, label: "Identifiant de la vidéo YouTube (ex. Q1Y7ekxagGA)", type: string, required: true }
      - { name: carte, label: Lien de la carte uMap, type: string, required: true }
      - { name: carteTexte, label: Texte d'introduction de la carte, type: text }
      - name: defis
        label: Défis
        type: object
        list: true
        fields:
          - { name: nom, label: Nom du défi, type: string }
          - { name: question, label: Énigme, type: text }
          - { name: reponse, label: Réponse, type: text }
          - { name: image, label: Image (facultative, ex. un blason), type: image }
          - { name: imageAlt, label: Description de l'image (accessibilité), type: string }
      - { name: body, label: Récit, type: rich-text }
  - name: accueil
    label: Page d'accueil
    type: file
    path: src/data/accueil.json
    format: json
    fields:
      - { name: mission, label: Mission, type: text }
      - { name: imageMission, label: Image de fond, type: image }
      - { name: questions, label: Questions, type: text }
      - { name: actionsTitre, label: Titre du bloc Actions et formations, type: string }
      - { name: formations, label: Texte du bloc Actions et formations, type: text }
      - { name: quiSommesNous, label: Qui sommes-nous ?, type: text }
      - name: equipe
        label: Équipe
        type: object
        list: true
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: role, label: Rôle, type: string }
          - { name: photo, label: Photo, type: image }
          - { name: bio, label: Présentation, type: text }
  - name: accueil-en
    label: Page d'accueil (anglais)
    type: file
    path: src/data/accueil.en.json
    format: json
    fields:
      - { name: mission, label: Mission, type: text }
      - { name: imageMission, label: Image de fond, type: image }
      - { name: questions, label: Questions, type: text }
      - { name: actionsTitre, label: Titre du bloc Actions et formations, type: string }
      - { name: formations, label: Texte du bloc Actions et formations, type: text }
      - { name: quiSommesNous, label: Qui sommes-nous ?, type: text }
      - name: equipe
        label: Équipe
        type: object
        list: true
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: role, label: Rôle, type: string }
          - { name: photo, label: Photo, type: image }
          - { name: bio, label: Présentation, type: text }
  - name: formations
    label: Interventions
    type: file
    path: src/data/formations.json
    format: json
    fields:
      - { name: titre, label: Titre de la page, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: actionsTitre, label: Titre « Actions sur mesure », type: string }
      - name: actions
        label: Actions sur mesure
        type: object
        list: true
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }
      - { name: referencesTitre, label: Titre des références, type: string }
      - name: references
        label: Références
        type: object
        list: true
        fields:
          - { name: periode, label: "Période (ex. Depuis 2024)", type: string }
          - { name: titre, label: Titre, type: string }
          - { name: detail, label: Détail, type: text }
          - { name: lien, label: Lien (facultatif), type: string }
  - name: formations-en
    label: Interventions (anglais)
    type: file
    path: src/data/formations.en.json
    format: json
    fields:
      - { name: titre, label: Titre de la page, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: actionsTitre, label: Titre « Actions sur mesure », type: string }
      - name: actions
        label: Actions sur mesure
        type: object
        list: true
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }
      - { name: referencesTitre, label: Titre des références, type: string }
      - name: references
        label: Références
        type: object
        list: true
        fields:
          - { name: periode, label: "Période (ex. Depuis 2024)", type: string }
          - { name: titre, label: Titre, type: string }
          - { name: detail, label: Détail, type: text }
          - { name: lien, label: Lien (facultatif), type: string }
  - name: mentions
    label: Mentions légales
    type: file
    path: src/content/mentions-legales.md
    fields:
      - { name: titre, label: Titre, type: string }
      - { name: body, label: Contenu, type: rich-text }
  - name: mentions-en
    label: Mentions légales (anglais)
    type: file
    path: src/content/mentions-legales.en.md
    fields:
      - { name: titre, label: Titre, type: string }
      - { name: body, label: Contenu, type: rich-text }
  - name: site
    label: Réglages du site
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: nom, label: Nom, type: string }
      - { name: slogan, label: Slogan, type: string }
      - { name: description, label: Description par défaut, type: text }
      - { name: email, label: E-mail de contact, type: string }
      - { name: web3formsKey, label: Clé Web3Forms du formulaire de contact, type: string }
      - name: reseaux
        label: Réseaux sociaux
        type: object
        list: true
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: url, label: Lien, type: string }
